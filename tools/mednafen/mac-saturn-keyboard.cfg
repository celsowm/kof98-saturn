# Mednafen Saturn keyboard-only config — friendly default for macOS
# -------------------------------------------------------------------
# Install on your Mac:
#   1. Install Mednafen (e.g. `brew install mednafen`, or the .app from
#      https://mednafen.github.io/).
#   2. Copy this file to:
#        ~/.mednafen/mednafen-09x.cfg
#      (If that file already exists, merge the `ss.*` lines below into it.)
#      Newer macOS builds may instead use:
#        ~/Library/Application Support/Mednafen/mednafen-09x.cfg
#   3. Put your Saturn BIOS in a folder you own and set `ss.bios_jp` below
#      to its absolute path (KOF98 JP needs the JP BIOS).
#   4. Launch: mednafen /path/to/kof98.cue
#
# Controls (player 1, arrow keys + left hand):
#   Move      : Arrow keys
#   A / B / C : Z / X / C          (main KOF98 attack buttons)
#   X / Y / Z : A / S / D          (Saturn X/Y/Z)
#   Start     : Space
#   L / R     : Left Shift / Left Ctrl
#
# Controls (player 2, local 2-player — IJKL + right hand):
#   Move      : I / J / K / L
#   A / B / C : U / O / P
#   X / Y / Z : R / T / Y
#   Start     : Return
#   L / R     : N / M
#
# Scancodes are Mednafen's SDL-style numbers; the values below were taken
# from Mednafen's own generated config, so they are known-good.

# --- BIOS ---------------------------------------------------------------
# Change this to your actual JP BIOS path on the Mac.
ss.bios_jp /Users/YOUR_USERNAME/ROMs/bios/saturn_bios_jp.bin
# ss.bios_na_eu /Users/YOUR_USERNAME/ROMs/bios/mpr-17933.bin

# --- Controllers ---------------------------------------------------------
ss.input.port1 gamepad
ss.input.port2 gamepad

# Player 1
ss.input.port1.gamepad.up keyboard 0x0 82
ss.input.port1.gamepad.down keyboard 0x0 81
ss.input.port1.gamepad.left keyboard 0x0 80
ss.input.port1.gamepad.right keyboard 0x0 79
ss.input.port1.gamepad.a keyboard 0x0 29
ss.input.port1.gamepad.b keyboard 0x0 27
ss.input.port1.gamepad.c keyboard 0x0 6
ss.input.port1.gamepad.x keyboard 0x0 4
ss.input.port1.gamepad.y keyboard 0x0 22
ss.input.port1.gamepad.z keyboard 0x0 7
ss.input.port1.gamepad.start keyboard 0x0 44
ss.input.port1.gamepad.ls keyboard 0x0 225
ss.input.port1.gamepad.rs keyboard 0x0 224

# Player 2
ss.input.port2.gamepad.up keyboard 0x0 12
ss.input.port2.gamepad.down keyboard 0x0 14
ss.input.port2.gamepad.left keyboard 0x0 13
ss.input.port2.gamepad.right keyboard 0x0 15
ss.input.port2.gamepad.a keyboard 0x0 24
ss.input.port2.gamepad.b keyboard 0x0 18
ss.input.port2.gamepad.c keyboard 0x0 19
ss.input.port2.gamepad.x keyboard 0x0 21
ss.input.port2.gamepad.y keyboard 0x0 23
ss.input.port2.gamepad.z keyboard 0x0 28
ss.input.port2.gamepad.start keyboard 0x0 40
ss.input.port2.gamepad.ls keyboard 0x0 17
ss.input.port2.gamepad.rs keyboard 0x0 16

# --- Nice-to-have defaults ----------------------------------------------
ss.input.mouse_sensitivity 0.50
ss.bios_sanity 1
# Show the FPS in a corner while testing (global Mednafen key)
fps.autoenable 1
